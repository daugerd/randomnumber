<!doctype html>
<html lang="en">
  <head>
    <title>Random Number</title>
    <script>
      function getRandomNumber() {
        document.getElementById("number").innerHTML = Math.floor(Math.random() * 20);
      }
    </script>
  </head>
  <body onload="getRandomNumber()">
    <h1>Random Number (0-19)</h1>
    <p><span id="number"></span></span></p>
  </body>
</html>
